interface:
  display_name: "大学之道"
  short_description: "一次一个可验证单元，由学习者选择方向并在单元边界记录进度"
  default_prompt: "Use $daxue-zhidao to start or resume a guided course. For every new course or direction change, ask targeted diagnostic questions based on the subject. When local tools affect the course, request consent to inspect and save only the necessary system, toolchain, and project versions without secrets. Then propose 2-3 starting units and wait for an explicit semantic choice."
policy:
  allow_implicit_invocation: true
